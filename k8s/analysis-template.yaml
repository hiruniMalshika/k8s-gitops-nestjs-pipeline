apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-analysis
  namespace: default
spec:
  metrics:
  - name: success-rate
    interval: 10s
    successCondition: result[0] >= 0.95
    failureLimit: 3
    provider:
      prometheus:
        address: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        # 👉 Correct PromQL Syntax
        query: |
          (sum(rate(http_requests_total{status=~"2.*"}[1m])) / sum(rate(http_requests_total[1m]))) or vector(1)